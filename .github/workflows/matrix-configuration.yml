name: Matrix Configuration
on:
  push:
  workflow_dispatch:

jobs:
    jobname1:
        strategy:
          fail-fast: false
          max-parallel: 2
          matrix:
            os: [ubuntu-latest, ubuntu-20.04, windows-latest]
            images: [hello-world, alpine]
            exclude:
              - images: alpine
                os: windows-latest
            include:
              - images: amd64/alpine
                os: ubuntu-20.04
        runs-on: ${{ matrix.os }}
        steps:
         - name: echo job1
           run: echo job1
         - name: run images - hello-world, alpine
           run: docker run ${{ matrix.images }}
    
    jobname2:
        runs-on: ubuntu-latest
        steps:
          - name: echo job2
            run: echo job2