name: Matrix Configuration
on:
  push:
  workflow_dispatch:

jobs:
    jobname1:
        strategy:
          matrix:
            os: [ubuntu-latest, ubuntu-20.04, windows-latest]
            images: [hello-world, alpine]
        runs-on: ${{ matrix.os }}
        steps:
         - name: echo job1
           run: echo job1
         - name: run images - hello-world, alpine
           run: docker run ${{ matrix.images }}
    
    jobname2:
        runs-on: ubuntu-latest
        steps:
          - name: echo job2
            run: echo job2