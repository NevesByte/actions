name: Multiple-Jobs
on: push

jobs:
    build_job_1:
      runs-on: ubuntu-latest
      steps:
      - name: checkout
        uses: actions/checkout@v4
        
      - name: command_1
        run: |
            mkdir -p path/to/artifact
            touch path/to/artifact/world.txt
            echo "job 1" >> path/to/artifact/world.txt
      
      - name: upload_artifact
        uses: actions/upload-artifact@v4
        with:
            name: my-artifact
            path: path/to/artifact/world.txt
    
    build_job_2:
      needs: build_job_1
      runs-on: ubuntu-latest
      steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download-artifact
        uses: actions/download-artifact@v4
        with:
            artifact-ids: 12345
            path: path/to/artifact/world.txt

      - name: command_2
        run: echo "job 2"
    
    build_job_3:
      needs: [build_job_1, build_job_2]
      runs-on: ubuntu-latest
      steps:
      - name: command_3
        run: echo "job 3"